name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Release version (e.g. 0.2.0)'
        required: true
        type: string

permissions: {}

jobs:
  prepare:
    uses: scottlz0310/release-automate/.github/workflows/reusable-prepare-release.yml@b155081b04cae981e8ae3beeb37aa1c024866ea2 # v3.3.0
    secrets:
      RELEASE_BOT_CLIENT_ID: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
    with:
      target_version: ${{ inputs.target_version }}
      bump_strategy: rust
