name: Release

# main のリリースコミットから draft Release を作り、3 ターゲットの ZIP・checksum・installer を
# 添付して検証した後にだけ公開する。PR では公開権限を使わずビルドと asset 構造だけを検証する。
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/**
      - Cargo.toml
      - Cargo.lock

permissions: {}

jobs:
  draft:
    if: github.event_name == 'push'
    uses: scottlz0310/release-automate/.github/workflows/reusable-publish-release.yml@fd3e676a431bbd6e189270e6911ec4c2307e9f2b # v2.0.0
    permissions:
      contents: write
    with:
      draft: true

  build:
    needs: draft
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.draft.outputs.release_state == 'draft') }}
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
    env:
      TARGET_SHA: ${{ needs.draft.outputs.target_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && format('refs/tags/{0}', needs.draft.outputs.tag_name) || '' }}
          persist-credentials: false

      - name: Verify tag points to release commit
        if: github.event_name == 'push'
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1.42.0
        if: runner.os == 'Linux'
        with:
          target: ${{ matrix.target }}

      - id: archive
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: agent-statusline
          target: ${{ matrix.target }}
          ref: ${{ github.event_name == 'push' && format('refs/tags/{0}', needs.draft.outputs.tag_name) || '' }}
          zip: all
          tar: none
          locked: true
          dry-run: true
          dry-run-intended: true

      - name: Write checksum
        shell: bash
        env:
          ARCHIVE: ${{ steps.archive.outputs.zip }}
        run: |
          mkdir dist
          mv -- "$ARCHIVE" dist/
          cd dist && sha256sum -b "$ARCHIVE" > "$ARCHIVE.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  attach:
    needs: [draft, build]
    if: needs.draft.outputs.release_state == 'draft'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.draft.outputs.tag_name }}
      TARGET_SHA: ${{ needs.draft.outputs.target_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.draft.outputs.target_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: assets
          merge-multiple: true

      - name: Attach assets to draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp scripts/agent-statusline-installer.ps1 scripts/agent-statusline-installer.sh assets/
          sh scripts/attach-release-assets.sh "$TAG" "$TARGET_SHA" assets

  # draft Release の asset 取得には push 権限が必要なため、公開経路の収集だけ write を使う。
  collect-release:
    needs: [draft, attach]
    if: needs.draft.outputs.release_state == 'draft'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      TAG: ${{ needs.draft.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.draft.outputs.target_sha }}
          persist-credentials: false

      - name: Download assets from draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "$TAG" --dir assets

      - id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Cargo.toml version $version does not match tag $TAG"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: assets/
          if-no-files-found: error

  collect-dry-run:
    needs: build
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: assets
          merge-multiple: true

      - id: version
        run: |
          cp scripts/agent-statusline-installer.ps1 scripts/agent-statusline-installer.sh assets/
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: assets/
          if-no-files-found: error

  verify:
    needs: [collect-release, collect-dry-run]
    if: ${{ !cancelled() && (needs.collect-release.result == 'success' || needs.collect-dry-run.result == 'success') }}
    name: Verify (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.collect-release.outputs.version || needs.collect-dry-run.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/verify-release-assets.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: assets

      - name: Verify assets and run binary
        shell: bash
        run: sh scripts/verify-release-assets.sh assets "$VERSION" "${{ matrix.target }}"

  finalize:
    needs: [draft, verify]
    if: ${{ !cancelled() && needs.draft.outputs.release_state == 'draft' && needs.verify.result == 'success' }}
    uses: scottlz0310/release-automate/.github/workflows/reusable-finalize-release.yml@fd3e676a431bbd6e189270e6911ec4c2307e9f2b # v2.0.0
    permissions:
      contents: write
    with:
      tag_name: ${{ needs.draft.outputs.tag_name }}
      target_sha: ${{ needs.draft.outputs.target_sha }}
