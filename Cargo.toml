[package]
name = "agent-statusline"
version = "0.1.0"
edition = "2024"
authors = ["scottlz0310"]
description = "High-performance, zero-fork statusline for AI coding agents (Antigravity, Claude Code, GitHub Copilot)"
readme = "README.md"
license = "MIT"
repository = "https://github.com/scottlz0310/agent-statusline"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
terminal_size = "0.4.4"
toml_edit = { version = "0.25.15", features = ["serde"] }
gix = { version = "0.87.1", default-features = false, features = ["status", "revision", "sha1"] }
ureq = { version = "3", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
